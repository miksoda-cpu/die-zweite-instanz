# Ideologische Einordnung der Quellen. Diese Datei ist Teil der
# öffentlichen Verfassung der Instanz: Jede Änderung gehört
# versioniert (git) und begründet.
#
# Skala "ausrichtung": -2 (links) .. 0 (mittig) .. +2 (rechts)
